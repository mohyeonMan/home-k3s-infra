apiVersion: apps/v1
kind: Deployment
metadata:
  name: srrrg-prod-app
  labels:
    app: srrrg-prod-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: srrrg-prod-app
  template:
    metadata:
      labels:
        app: srrrg-prod-app
    spec:
      containers:
      - name: srrrg-prod-app
        image: ghcr.io/mohyeonman/srrrg
        ports:
        - containerPort: 8080
          name: app
        resources:
          requests:
            cpu: 100m
            memory: 512Mi
          limits:
            cpu: 500m
            memory: 1Gi
        env:
        - name: SPRING_PROFILES_ACTIVE
          value: prod
        - name: SRRRG_BASE_URL
          value: https://srrrg.link
        - name: SRRRG_TRUST_FORWARDED_HEADERS
          value: "true"
        - name: SRRRG_JWT_ACTIVE_KID
          valueFrom:
            secretKeyRef:
              name: srrrg-prod-auth
              key: jwt-active-kid
              optional: true
        - name: SRRRG_JWT_ACTIVE_KEY_BASE64
          valueFrom:
            secretKeyRef:
              name: srrrg-prod-auth
              key: jwt-active-key-base64
              optional: true
        - name: SRRRG_JWT_PREVIOUS_KID
          valueFrom:
            secretKeyRef:
              name: srrrg-prod-auth
              key: jwt-previous-kid
              optional: true
        - name: SRRRG_JWT_PREVIOUS_KEY_BASE64
          valueFrom:
            secretKeyRef:
              name: srrrg-prod-auth
              key: jwt-previous-key-base64
              optional: true
        - name: GOOGLE_OAUTH_CLIENT_ID
          valueFrom:
            secretKeyRef:
              name: srrrg-prod-auth
              key: google-client-id
              optional: true
        - name: GOOGLE_OAUTH_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: srrrg-prod-auth
              key: google-client-secret
              optional: true
        - name: KAKAO_OAUTH_CLIENT_ID
          valueFrom:
            secretKeyRef:
              name: srrrg-prod-auth
              key: kakao-client-id
              optional: true
        - name: KAKAO_OAUTH_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: srrrg-prod-auth
              key: kakao-client-secret
              optional: true
        - name: GITHUB_OAUTH_CLIENT_ID
          valueFrom:
            secretKeyRef:
              name: srrrg-prod-auth
              key: github-client-id
              optional: true
        - name: GITHUB_OAUTH_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: srrrg-prod-auth
              key: github-client-secret
              optional: true
        - name: SPRING_MAIL_HOST
          value: smtp.gmail.com
        - name: SPRING_MAIL_PORT
          value: "587"
        - name: SPRING_MAIL_USERNAME
          value: srrrg.noreply@gmail.com
        - name: SPRING_MAIL_PASSWORD
          valueFrom:
            secretKeyRef:
              name: srrrg-prod-mail
              key: SPRING_MAIL_PASSWORD
        - name: SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH
          value: "true"
        - name: SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE
          value: "true"
        - name: SRRRG_MAIL_FROM
          value: srrrg.noreply@gmail.com
        - name: SRRRG_URL_RISK_PROVIDER
          value: google
        - name: SRRRG_URL_RISK_FIXED_SAFE_DELAY
          value: 100ms
        - name: SRRRG_URL_RISK_FIXED_SAFE_CACHE_DURATION
          value: 5m
        - name: SPRING_DATASOURCE_URL
          valueFrom:
            secretKeyRef:
              name: srrrg-db-auth
              key: prod-db-url
        - name: SPRING_DATASOURCE_USERNAME
          valueFrom:
            secretKeyRef:
              name: srrrg-db-auth
              key: prod-db-username
        - name: SPRING_DATASOURCE_PASSWORD
          valueFrom:
            secretKeyRef:
              name: srrrg-db-auth
              key: prod-db-password
        - name: GOOGLE_SAFE_BROWSING_API_KEY
          valueFrom:
            secretKeyRef:
              name: srrrg-google-safe-browsing
              key: GOOGLE_SAFE_BROWSING_API_KEY
        - name: JAVA_TOOL_OPTIONS
          value: -XX:MaxRAMPercentage=75
        lifecycle:
          preStop:
            exec:
              command:
              - sh
              - -c
              - sleep 10
        readinessProbe:
          httpGet:
            path: /actuator/health/readiness
            port: app
          initialDelaySeconds: 20
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 6
        livenessProbe:
          httpGet:
            path: /actuator/health/liveness
            port: app
          initialDelaySeconds: 60
          periodSeconds: 20
          timeoutSeconds: 3
          failureThreshold: 3
