apiVersion: batch/v1
kind: Job
metadata:
  name: postgres-enable-pg-stat-statements
  namespace: postgres
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
spec:
  backoffLimit: 6
  template:
    metadata:
      labels:
        app: postgres-enable-pg-stat-statements
    spec:
      restartPolicy: Never
      containers:
      - name: enable-extension
        image: postgres:16
        command:
        - sh
        - -c
        args:
        - |
          set -eu

          until pg_isready --host postgres --username "$POSTGRES_USER"; do
            sleep 2
          done

          psql -v ON_ERROR_STOP=1 \
            --host postgres \
            --username "$POSTGRES_USER" \
            --dbname postgres \
            --command "
              DO \$\$
              BEGIN
                IF NOT EXISTS (
                  SELECT FROM pg_catalog.pg_roles
                  WHERE rolname = 'postgres_exporter'
                ) THEN
                  CREATE ROLE postgres_exporter LOGIN;
                END IF;
              END
              \$\$;
              GRANT pg_monitor TO postgres_exporter;
            "

          for database in postgres srrrg-dev srrrg-prod; do
            psql -v ON_ERROR_STOP=1 \
              --host postgres \
              --username "$POSTGRES_USER" \
              --dbname "$database" \
              --command 'CREATE EXTENSION IF NOT EXISTS pg_stat_statements;'
          done
        env:
        - name: POSTGRES_USER
          value: postgres
        - name: PGPASSWORD
          valueFrom:
            secretKeyRef:
              name: postgres-auth
              key: postgres-password
