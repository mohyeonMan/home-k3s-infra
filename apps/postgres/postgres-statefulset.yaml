apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: postgres
spec:
  serviceName: postgres-headless
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
      - name: postgres
        image: postgres:16
        args:
        - -c
        - shared_preload_libraries=pg_stat_statements
        - -c
        - compute_query_id=on
        - -c
        - pg_stat_statements.max=5000
        - -c
        - pg_stat_statements.track=top
        - -c
        - track_io_timing=on
        ports:
        - containerPort: 5432
          name: postgres
        resources:
          requests:
            cpu: 300m
            memory: 512Mi
          limits:
            cpu: "1"
            memory: 2Gi
        env:
        - name: POSTGRES_USER
          value: postgres
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: postgres-auth
              key: postgres-password
        - name: SRRRG_DEV_DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: postgres-auth
              key: srrrg-dev-db-password
        - name: SRRRG_PROD_DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: postgres-auth
              key: srrrg-prod-db-password
        volumeMounts:
        - name: data
          mountPath: /var/lib/postgresql/data
        - name: init
          mountPath: /docker-entrypoint-initdb.d
          readOnly: true
        - name: postgres-socket
          mountPath: /var/run/postgresql
        livenessProbe:
          exec:
            command:
            - pg_isready
            - -U
            - postgres
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          exec:
            command:
            - pg_isready
            - -U
            - postgres
          initialDelaySeconds: 5
          periodSeconds: 10
      - name: postgres-exporter
        image: quay.io/prometheuscommunity/postgres-exporter:v0.19.1
        args:
        - --collector.database
        - --collector.locks
        - --collector.stat_activity
        - --collector.stat_database
        - --collector.stat_user_tables
        - --collector.statio_user_tables
        env:
        - name: DATA_SOURCE_NAME
          value: host=/var/run/postgresql user=postgres_exporter dbname=postgres sslmode=disable
        - name: PG_EXPORTER_COLLECTION_TIMEOUT
          value: 4s
        ports:
        - containerPort: 9187
          name: metrics
        resources:
          requests:
            cpu: 25m
            memory: 32Mi
          limits:
            cpu: 100m
            memory: 128Mi
        volumeMounts:
        - name: postgres-socket
          mountPath: /var/run/postgresql
      volumes:
      - name: init
        configMap:
          name: postgres-init
      - name: postgres-socket
        emptyDir: {}
  volumeClaimTemplates:
  - metadata:
      name: data
    spec:
      accessModes:
      - ReadWriteOnce
      storageClassName: local-path
      resources:
        requests:
          storage: 10Gi
