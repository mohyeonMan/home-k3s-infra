apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: postgres
  namespace: postgres
  labels:
    release: monitoring
spec:
  selector:
    matchLabels:
      app: postgres
  namespaceSelector:
    matchNames:
    - postgres
  endpoints:
  - port: metrics
    path: /metrics
    interval: 10s
    scrapeTimeout: 5s
